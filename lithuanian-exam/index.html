<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lithuanian A1 and A2 practice exam: reading, listening, grammar, writing and speaking.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lithuanian A1–A2 Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout: one exam-paper column under a sticky control strip; the five exam parts run as a Roman-numbered sequence */
:root{
  --paper:#f2f5f1; --surface:#fdfefc; --ink:#15231a; --muted:#56675c; --line:#d3dbd2;
  --accent:#1c5a3b; --accent-ink:#ffffff; --mark:#cf9310;
  --ok:#21754a; --ok-bg:#e1f1e6; --bad:#ad3329; --bad-bg:#f7e3df;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101612; --surface:#17201a; --ink:#e2eae3; --muted:#95a59a; --line:#29352d;
  --accent:#84c8a1; --accent-ink:#0e1912; --mark:#e9b543;
  --ok:#72cf96; --ok-bg:#15301f; --bad:#f0867b; --bad-bg:#3a1c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101612; --surface:#17201a; --ink:#e2eae3; --muted:#95a59a; --line:#29352d;
  --accent:#84c8a1; --accent-ink:#0e1912; --mark:#e9b543;
  --ok:#72cf96; --ok-bg:#15301f; --bad:#f0867b; --bad-bg:#3a1c18; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:47rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
i.en,.en{color:var(--muted);font-style:italic;font-weight:400}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:.7rem .55rem;display:flex;flex-direction:column;gap:.6rem}
.row1{display:flex;align-items:center;gap:.75rem 1rem;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;min-width:0}
.brand b{font:600 .72rem var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.brand span{font-size:.78rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:.3rem .8rem;border-radius:999px;font-size:.85rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.levels button{font:600 .95rem var(--f-display);padding:.25rem .9rem}
.clock{display:flex;align-items:center;gap:.45rem}
.clock output{font:500 1rem var(--f-mono);font-variant-numeric:tabular-nums;min-width:3.6rem;text-align:right}
.clock output.over{color:var(--bad)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:.28rem .65rem;font-size:.82rem}
.ghost:hover{border-color:var(--muted)}
.parts{display:flex;flex-wrap:wrap;gap:.25rem}
.part{border:0;background:none;padding:.3rem .55rem .35rem;border-radius:6px;font-size:.84rem;color:var(--muted);display:inline-flex;align-items:baseline;gap:.35rem;border-bottom:2px solid transparent}
.part .rn{font:500 .7rem var(--f-mono);letter-spacing:.04em}
.part[aria-current="step"]{color:var(--ink);background:var(--surface);border-bottom-color:var(--accent)}
.part .dot{width:.4rem;height:.4rem;border-radius:50%;background:var(--accent);align-self:center}
.badge{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:.15rem .45rem;border-radius:4px;background:var(--ok-bg);color:var(--ok)}

/* section */
main .wrap{padding-block:1.75rem 4rem}
.sec-head{display:flex;flex-direction:column;gap:.35rem;padding-bottom:1.25rem;border-bottom:1px solid var(--line)}
.eyebrow{margin:0;font:500 .74rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sec-head h1{font:600 2.1rem/1.1 var(--f-display);letter-spacing:-.01em}
.sec-head h1 .en{font:400 1.05rem var(--f-body);margin-left:.4rem}
.meta{margin:0;font-size:.85rem;color:var(--muted)}
.intro{margin:.35rem 0 0;max-width:62ch}

.task{margin-top:2.25rem;display:flex;flex-direction:column;gap:.9rem}
.task-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem 1rem;flex-wrap:wrap}
.task-head h2{font:600 1.3rem/1.25 var(--f-display)}
.tn{display:block;font:500 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}
.pts{font:500 .76rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem;white-space:nowrap}
.en-inst{margin:-.4rem 0 0;color:var(--muted);font-style:italic;font-size:.9rem}

.passage{font:400 1.06rem/1.68 var(--f-display);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.3rem;max-width:66ch}
.passage p{margin:0 0 .75rem}.passage p:last-child{margin-bottom:0}
.passage .sig{text-align:right;font-style:italic}

/* questions */
.qs{display:flex;flex-direction:column}
.q{padding:.95rem 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.55rem}
.qs .q:first-child{border-top:0;padding-top:.2rem}
.q-text{margin:0;font-weight:500;display:flex;gap:.55rem;align-items:baseline;flex-wrap:wrap}
.qn{flex:none;font:500 .78rem var(--f-mono);color:var(--muted);min-width:1.4rem}
.q.ok .qn{color:var(--ok)}.q.bad .qn{color:var(--bad)}
.sign{display:inline-block;font:700 1rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;border:2px solid var(--ink);padding:.35rem .85rem;border-radius:3px;background:var(--surface)}
.opts{display:flex;flex-direction:column;gap:.15rem;padding-left:1.95rem}
.q-tf .opts{flex-direction:row;flex-wrap:wrap;gap:.4rem}
.opt{position:relative;display:flex;gap:.6rem;align-items:center;padding:.4rem .55rem;border:1px solid transparent;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--surface);border-color:var(--line)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.bub{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:500 .74rem var(--f-mono);color:var(--muted)}
.opt input:checked + .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt:has(input:focus-visible){outline:2px solid var(--mark);outline-offset:1px}
.opt:has(input:disabled){cursor:default}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-correct .bub{border-color:var(--ok)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong input:checked + .bub{background:var(--bad);border-color:var(--bad)}

/* menu */
.menu{font-family:var(--f-display);max-width:30rem}
.menu-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:.4rem;margin-bottom:.6rem}
.menu-head b{font-size:1.35rem}
.menu-head span{font:italic .9rem var(--f-display);color:var(--muted)}
.menu h4{margin:.7rem 0 .25rem;font:600 .76rem var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.menu h4 small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:.4rem}
.menu .li{display:flex;align-items:baseline;gap:.4rem;margin:0}
.menu .li i{flex:1;border-bottom:1px dotted var(--muted);transform:translateY(-.25rem)}
.menu .li span:last-child{font-variant-numeric:tabular-nums}

/* match */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:.6rem}
.ad{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.75rem .9rem;display:flex;gap:.7rem;min-width:0}
.ad-k{font:700 1.45rem/1 var(--f-display);color:var(--accent)}
.ad p{margin:0;font:400 .95rem/1.5 var(--f-display)}
.match{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:.4rem .8rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow p{margin:0;min-width:0}
.mrow.ok .qn{color:var(--ok)}.mrow.bad .qn{color:var(--bad)}
select{font:inherit;font-size:.95rem;padding:.3rem .45rem;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink)}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fix{font:500 .82rem var(--f-mono);color:var(--ok);font-style:normal;white-space:nowrap}

/* cloze */
.bank{display:flex;flex-wrap:wrap;gap:.35rem}
.bank span{font:500 .85rem var(--f-mono);padding:.2rem .55rem;border:1px dashed var(--muted);border-radius:4px}
.cloze{line-height:2.2}
.gap{white-space:nowrap}
.gap sup{font:500 .65rem var(--f-mono);color:var(--muted);margin-right:.15rem}
.gap select{font-family:var(--f-display);font-size:.98rem;padding:.12rem .3rem}
.gap .fix{margin-left:.3rem}

/* form */
.form-card{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:1rem 1.15rem 1.2rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.9rem 1.4rem}
.form-title{grid-column:1/-1;margin:0;font:500 .78rem var(--f-mono);letter-spacing:.18em}
.field{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.field>span{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{font:inherit;font-size:1rem;border:0;border-bottom:1.5px solid var(--muted);background:transparent;color:var(--ink);padding:.25rem .15rem;border-radius:0;width:100%}
.field input.ok{border-bottom-color:var(--ok)}.field input.bad{border-bottom-color:var(--bad)}

/* writing */
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.9rem 1.1rem}
.prompt p{margin:0 0 .4rem}.prompt ul{margin:.2rem 0 0;padding-left:1.2rem}
.write{display:flex;flex-direction:column;gap:.45rem}
.keys{display:flex;flex-wrap:wrap;gap:.3rem}
.key{border:1px solid var(--line);background:var(--surface);border-radius:4px;min-width:2.1rem;padding:.2rem .4rem;font:500 1rem var(--f-display)}
.key:hover{border-color:var(--muted)}
textarea{font:1rem/1.6 var(--f-display);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem;width:100%;resize:vertical;min-height:11rem}
.wc{margin:0;font:500 .8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.wc.in{color:var(--ok)}
.crit{border-top:1px solid var(--line);padding-top:.8rem;display:flex;flex-direction:column;gap:.35rem}
.crit-h{margin:0 0 .2rem;font-weight:600;font-size:.92rem}
.crit-h span{font-weight:400;color:var(--muted);font-style:italic;margin-left:.3rem}
.ck{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}
.ck input{accent-color:var(--accent);margin-top:.3rem;flex:none;width:1rem;height:1rem}
details.model{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
details.model summary{padding:.6rem .9rem;cursor:pointer;font-weight:500}
details.model>div,details.model>p{padding:0 1.1rem 1rem;margin:0}
.model-text{font:1rem/1.65 var(--f-display);white-space:pre-line}

/* speaking */
.prompts{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column}
.prompts li{display:flex;gap:.8rem;align-items:flex-start;justify-content:space-between;padding:.8rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prompts li:first-child{border-top:0}
.prompts li p{margin:0;flex:1 1 18rem;min-width:0}
.prompts li p b{font:500 .78rem var(--f-mono);color:var(--muted);margin-right:.5rem}
.stimer{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.25rem .75rem;font:500 .8rem var(--f-mono);font-variant-numeric:tabular-nums}
.stimer.run{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.phrases ul{margin:.2rem 0 0;padding-left:1.2rem;font-family:var(--f-display);font-size:1.02rem}

/* listening */
.listen-bar{margin-top:1.25rem;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
.voice-note{margin:0;font-size:.84rem;color:var(--muted);flex:1 1 16rem}
.player{display:flex;align-items:center;gap:.5rem .7rem;flex-wrap:wrap}
.play{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:.38rem .95rem;font-weight:500;font-size:.88rem}
.play:disabled{opacity:.45;cursor:not-allowed}
.left{font:500 .76rem var(--f-mono);color:var(--muted)}
.transcript{font:italic .98rem/1.6 var(--f-display);background:var(--surface);border-left:2px solid var(--line);padding:.5rem .9rem}
.transcript p{margin:0}

/* results + nav */
.next{margin-top:2.5rem;display:flex;justify-content:flex-end}
.btn{border:1px solid var(--ink);background:var(--surface);border-radius:6px;padding:.55rem 1.05rem;font-weight:500}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn.primary.confirm{background:var(--bad);border-color:var(--bad)}
.res-top{display:flex;align-items:flex-end;gap:1rem 2rem;flex-wrap:wrap;padding-block:1.5rem 1rem}
.score{font:600 4.2rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score small{font-size:1.4rem;color:var(--muted);margin-left:.15rem}
.verdict{display:flex;flex-direction:column;gap:.3rem;padding-bottom:.5rem}
.pill{align-self:flex-start;font:500 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:.2rem .6rem;border-radius:4px}
.pill.pass{background:var(--ok-bg);color:var(--ok)}.pill.fail{background:var(--bad-bg);color:var(--bad)}
.verdict p{margin:0;color:var(--muted);font-size:.9rem;max-width:40ch}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:minmax(0,11rem) 1fr auto;gap:.4rem 1rem;align-items:center;padding:.75rem 0;border-bottom:1px solid var(--line)}
.rrow b{font-weight:500}.rrow b small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.bar{height:.5rem;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.low{background:var(--bad)}
.num{font:500 .88rem var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:6.5rem}
.note{margin:1.25rem 0 0;font-size:.88rem;color:var(--muted);max-width:62ch}
.actions{margin-top:1.75rem;display:flex;gap:.6rem;flex-wrap:wrap}
.todo{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid var(--line)}
.todo li{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.todo li span:last-child{font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}

@media (max-width:520px){
  .sec-head h1{font-size:1.75rem}
  .opts{padding-left:0}
  .mrow{grid-template-columns:auto 1fr}
  .mrow select{grid-column:2;justify-self:start}
  .mrow .fix{grid-column:2}
  .rrow{grid-template-columns:1fr auto}
  .rrow .bar{grid-column:1/-1;grid-row:2}
  .score{font-size:3.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row1">
      <div class="brand"><b>Lietuvių kalbos egzaminas</b><span>Praktinis variantas · Practice paper</span></div>
      <div class="seg levels" role="group" aria-label="Lygis">
        <button type="button" data-level="A1" aria-pressed="true">A1</button>
        <button type="button" data-level="A2" aria-pressed="false">A2</button>
      </div>
      <div class="clock" title="Laikas raštu atliekamoms dalims">
        <output id="clock">75:00</output>
        <button type="button" class="ghost" id="clockBtn">Pradėti laiką</button>
      </div>
    </div>
    <nav class="parts" id="parts" aria-label="Egzamino dalys"></nav>
  </div>
</header>
<main id="main"><div class="wrap" id="paper"></div></main>

<script>
/* ---------- exam content ---------- */
const EXAM = {
A1:{ name:"Pradmenų lygis", minutes:75, sections:[
 { id:"skaitymas", name:"Skaitymas", en:"Reading", min:20,
   intro:'Perskaitykite užrašus ir tekstus. Pasirinkite teisingą atsakymą. <i class="en">Read the signs and texts and choose the correct answer.</i>',
   tasks:[
   { kind:"mc", title:"Ką reiškia užrašas?", en:"What does the sign mean?", items:[
     {sign:"Nerūkyti", opts:["Čia negalima rūkyti.","Čia galima rūkyti.","Čia parduodamos cigaretės."]},
     {sign:"Išėjimas", opts:["Pro čia galima išeiti.","Pro čia galima įeiti.","Čia galima pavalgyti."]},
     {sign:"Kasa Nr. 3 nedirba", opts:["Trečioji kasa dabar uždaryta.","Trečiojoje kasoje galima mokėti tik kortele.","Čia dirba trys kasininkai."]},
     {sign:"Dirbame kasdien 9–21 val.", opts:["Parduotuvė atidaryta ir sekmadienį.","Sekmadienį parduotuvė nedirba.","Parduotuvė dirba tik vakare."]},
     {sign:"Atsargiai! Slidu", opts:["Čia galima paslysti.","Čia reikia bėgti.","Čia negalima stovėti."]}
   ]},
   { kind:"mc", title:"Rūta pasakoja apie save", en:"Read the text. Is the sentence true (Taip) or false (Ne)?",
     passage:`<p>Labas! Mano vardas Rūta. Aš esu iš Kauno, bet dabar gyvenu Vilniuje. Man dvidešimt penkeri metai. Aš dirbu mokykloje – esu anglų kalbos mokytoja.</p><p>Mano vyras Tomas yra gydytojas. Mes turime vieną dukterį. Jai treji metai, ją vadina Ema.</p><p>Savaitgaliais mes mėgstame vaikščioti parke ir važiuoti pas mano tėvus į Kauną. Mano mama labai skaniai gamina cepelinus!</p>`,
     items:[
     {q:"Rūta gyvena Kaune.", tf:false},
     {q:"Rūta yra mokytoja.", tf:true},
     {q:"Rūtos vyras dirba mokykloje.", tf:false},
     {q:"Ema yra Rūtos duktė.", tf:true},
     {q:"Savaitgaliais šeima važiuoja į Kauną.", tf:true},
     {q:"Rūtos tėvai gyvena Vilniuje.", tf:false}
   ]},
   { kind:"mc", title:"Kavinės meniu", en:"Read the menu and answer the questions.",
     passage:`<div class="menu"><div class="menu-head"><b>Kavinė „Liepa“</b><span>Pirmadieniais nedirbame</span></div>
       <h4>Pusryčiai <small>8.00–11.00</small></h4>
       <p class="li"><span>Blynai su varške</span><i></i><span>4,50 €</span></p>
       <p class="li"><span>Kiaušinienė su duona</span><i></i><span>3,80 €</span></p>
       <p class="li"><span>Avižų košė</span><i></i><span>3,00 €</span></p>
       <h4>Sriubos</h4>
       <p class="li"><span>Šaltibarščiai</span><i></i><span>3,50 €</span></p>
       <p class="li"><span>Žirnių sriuba</span><i></i><span>3,20 €</span></p>
       <h4>Gėrimai</h4>
       <p class="li"><span>Kava</span><i></i><span>2,20 €</span></p>
       <p class="li"><span>Arbata</span><i></i><span>1,80 €</span></p>

/* ---------- helpers ---------- */
const ROMAN=["I","II","III","IV","V"];
const $=s=>document.querySelector(s);
function norm(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim().replace(/\s+/g," ")}
function digits(v){return String(v||"").replace(/\D/g,"")}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function cid(id){return "q-"+id.replace(/\./g,"-")}
function tasku(n){const t=n%10,h=n%100;if(t===1&&h!==11)return n+" taškas";if(t>=2&&t<=9&&!(h>=12&&h<=19))return n+" taškai";return n+" taškų"}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function order(n,id){const a=[...Array(n).keys()];let h=hash(id)||1;for(let i=n-1;i>0;i--){h^=h<<13;h^=h>>>17;h^=h<<5;h>>>=0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function words(t){const m=String(t||"").trim().match(/[^\s.,!?;:–—"„“()]+/g);return m?m.length:0}
function fmt(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")}

/* ---------- state ---------- */
const LS="lt-exam-v1";
const S={level:"A1",sec:{A1:0,A2:0},ans:{},chk:{},plays:{},done:{A1:false,A2:false},timer:{},slow:false};
try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r)for(const k in S)if(r[k]!==undefined)S[k]=r[k]}catch(e){}
for(const L of ["A1","A2"]) if(!S.timer[L]) S.timer[L]={left:EXAM[L].minutes*60,running:false};
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---------- scoring ---------- */
function taskMax(t){
  if(t.kind==="mc"||t.kind==="match")return t.items.length;
  if(t.kind==="cloze")return t.answers.length;
  if(t.kind==="form")return t.fields.length;
  return t.criteria.length*2;
}
function mcCorrect(it){return it.tf!==undefined?(it.tf?0:1):0}
function gradeTask(L,s,ti,t){
  const base=`${L}.${s}.${ti}`;let sc=0,auto=0,answered=0;
  const a=id=>{const v=S.ans[id];if(v!==undefined&&v!=="")answered++;return v};
  if(t.kind==="mc")t.items.forEach((it,i)=>{auto++;if(a(`${base}.${i}`)===mcCorrect(it))sc++});
  else if(t.kind==="match")t.items.forEach((it,i)=>{auto++;if(a(`${base}.${i}`)===it.a)sc++});
  else if(t.kind==="cloze")t.answers.forEach((w,i)=>{auto++;if(a(`${base}.${i}`)===w)sc++});
  else if(t.kind==="form")t.fields.forEach((f,i)=>{auto++;const v=a(`${base}.${i}`);if(v&&f.check(v))sc++});
  else t.criteria.forEach((c,i)=>{if(S.chk[`${base}.c${i}`])sc+=2});
  return {sc,mx:taskMax(t),auto,answered,self:t.kind==="write"||t.kind==="speak"};
}
function gradeLevel(L){
  return EXAM[L].sections.map((sec,s)=>{
    const r={name:sec.name,en:sec.en,sc:0,mx:0,auto:0,answered:0,self:false};
    sec.tasks.forEach((t,ti)=>{const g=gradeTask(L,s,ti,t);r.sc+=g.sc;r.mx+=g.mx;r.auto+=g.auto;r.answered+=g.answered;r.self=r.self||g.self});
    return r;
  });
}

/* ---------- listening (speech synthesis) ---------- */
const CLIPS={};
const ttsOK="speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let ltVoice=null,voicesKnown=false,playing=null;
function pickVoice(){
  if(!ttsOK)return;
  try{const vs=speechSynthesis.getVoices();if(vs.length)voicesKnown=true;ltVoice=vs.find(v=>/^lt([-_]|$)/i.test(v.lang))||null}catch(e){}
  updatePlayers();
}
if(ttsOK){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}setTimeout(()=>{voicesKnown=true;pickVoice()},1200)}

function playClip(id){
  if(!ttsOK)return;
  if(playing===id){speechSynthesis.cancel();playing=null;updatePlayers();return}
  const used=S.plays[id]||0;
  if(used>=2&&!S.done[S.level])return;
  speechSynthesis.cancel();
  S.plays[id]=used+1;save();
  playing=id;
  const lines=CLIPS[id]||[];const rate=S.slow?0.72:0.92;
  lines.forEach(([sp,txt],i)=>{
    const u=new SpeechSynthesisUtterance(txt);
    u.lang="lt-LT";if(ltVoice)u.voice=ltVoice;u.rate=rate;
    u.pitch=sp==="A"?1.18:sp==="B"?0.78:1;
    if(i===lines.length-1)u.onend=u.onerror=()=>{if(playing===id){playing=null;updatePlayers()}};
    speechSynthesis.speak(u);
  });
  updatePlayers();
}
function updatePlayers(){
  const done=S.done[S.level];
  document.querySelectorAll(".player").forEach(p=>{
    const id=p.dataset.clip,used=S.plays[id]||0,left=Math.max(0,2-used),b=p.querySelector(".play"),isP=playing===id;
    if(!ttsOK){b.disabled=true;b.textContent="Garsas nepalaikomas"}
    else{b.textContent=isP?"■ Stabdyti":(used===0?"▶ Klausyti":"▶ Klausyti dar kartą");b.disabled=!isP&&left===0&&!done}
    p.querySelector(".left").textContent=done?"Klausyti galima be apribojimų":`Liko: ${left} iš 2`;
    p.querySelector(".tx").hidden=!(done||!ttsOK||(voicesKnown&&!ltVoice));
  });
  const vn=$("#voiceNote");
  if(vn){
    vn.innerHTML=!ttsOK?'Ši naršyklė negali skaityti teksto garsiai, todėl tekstai rodomi raštu. <i class="en">This browser has no speech output; read the transcripts instead.</i>'
      :ltVoice?`Balsas: ${esc(ltVoice.name)}. Tekstus pamatysite baigę egzaminą. <i class="en">Transcripts unlock when you finish.</i>`
      :voicesKnown?'Šiame įrenginyje nėra lietuviško balso, todėl tarimas gali būti netikslus. Galite atidaryti tekstą. <i class="en">No Lithuanian voice on this device, so transcripts are available now.</i>'
      :'Ieškomas lietuviškas balsas… <i class="en">Looking for a Lithuanian voice…</i>';
  }
}
function player(id,lines){
  CLIPS[id]=lines;
  return `<div class="player" data-clip="${id}"><button type="button" class="play">▶ Klausyti</button><span class="left"></span><button type="button" class="ghost tx" hidden>Rodyti tekstą</button></div>
  <div class="transcript" hidden>${lines.map(([sp,t])=>`<p>${sp==="N"?"":"– "}${esc(t)}</p>`).join("")}</div>`;
}

/* ---------- rendering ---------- */
function mcQ(id,it,n,done){
  const tf=it.tf!==undefined,opts=tf?["Taip","Ne"]:it.opts,correct=mcCorrect(it),ord=tf?[0,1]:order(opts.length,id),val=S.ans[id];
  const st=done?(val===correct?"ok":"bad"):"";
  const pre=it.clip?player(id+".clip",it.clip):"";
  const qt=it.sign?`<span class="sign">${esc(it.sign)}</span>`:esc(it.q||"Pasirinkite žodį, kuris netinka.");
  return `<div class="q ${tf?"q-tf":""} ${st}" role="radiogroup" aria-labelledby="${cid(id)}-l">
    ${pre}<p class="q-text" id="${cid(id)}-l"><span class="qn">${n}.</span>${qt}</p>
    <div class="opts">${ord.map((o,k)=>{
      const cls=done?(o===correct?"is-correct":(val===o?"is-wrong":"")):"";
      return `<label class="opt ${cls}"><input type="radio" name="${cid(id)}" data-id="${id}" value="${o}" ${val===o?"checked":""} ${done?"disabled":""}><span class="bub">${tf?(o===0?"T":"N"):"ABCD"[k]}</span><span>${esc(opts[o])}</span></label>`}).join("")}</div></div>`;
}
function criteria(base,t){
  return `<div class="crit"><p class="crit-h">Įsivertinimas<span>Self-check · 2 taškai už kiekvieną punktą</span></p>
  ${t.criteria.map((c,i)=>{const id=`${base}.c${i}`;return `<label class="ck"><input type="checkbox" id="${cid(id)}" data-chk="${id}" ${S.chk[id]?"checked":""}><span>${esc(c)}</span></label>`}).join("")}</div>`;
}
function renderTask(L,s,ti,t,tn,done){
  const base=`${L}.${s}.${ti}`;
  let h=`<section class="task"><div class="task-head"><h2><span class="tn">${tn} užduotis</span>${esc(t.title)}</h2><span class="pts">${tasku(taskMax(t))}</span></div><p class="en-inst">${esc(t.en)}</p>`;
  if(t.clip)h+=player(base+".clip",t.clip);
  if(t.passage)h+=`<div class="passage">${t.passage}</div>`;
  if(t.kind==="mc"){
    h+=`<div class="qs">${t.items.map((it,i)=>mcQ(`${base}.${i}`,it,i+1,done)).join("")}</div>`;
  }else if(t.kind==="match"){
    h+=`<div class="ads">${t.ads.map(a=>`<div class="ad"><span class="ad-k">${a.k}</span><p>${esc(a.t)}</p></div>`).join("")}</div><ol class="match">`;
    t.items.forEach((it,i)=>{const id=`${base}.${i}`,v=S.ans[id]||"",ok=v===it.a,st=done?(ok?"ok":"bad"):"";
      h+=`<li class="mrow ${st}"><span class="qn">${i+1}.</span><p>${esc(it.q)}</p><select id="${cid(id)}" data-id="${id}" class="${st}" aria-label="Skelbimas ${i+1} klausimui" ${done?"disabled":""}><option value="">—</option>${t.ads.map(a=>`<option ${v===a.k?"selected":""}>${a.k}</option>`).join("")}</select>${done&&!ok?`<em class="fix">Teisingai: ${it.a}</em>`:""}</li>`});
    h+=`</ol>`;
  }else if(t.kind==="cloze"){
    const txt=t.text.replace(/\{(\d)\}/g,(m,d)=>{const id=`${base}.${d}`,v=S.ans[id]||"",ok=v===t.answers[d],st=done?(ok?"ok":"bad"):"";
      return `<span class="gap"><sup>${+d+1}</sup><select id="${cid(id)}" data-id="${id}" class="${st}" aria-label="Spraga ${+d+1}" ${done?"disabled":""}><option value="">…</option>${t.bank.map(w=>`<option ${v===w?"selected":""}>${w}</option>`).join("")}</select>${done&&!ok?`<em class="fix">${t.answers[d]}</em>`:""}</span>`});
    h+=`<div class="bank" aria-label="Žodžiai">${t.bank.map(w=>`<span>${w}</span>`).join("")}</div><div class="passage cloze">${txt}</div>`;
  }else if(t.kind==="form"){
    h+=`<div class="passage">${t.source}</div><div class="form-card"><p class="form-title">ANKETA</p>${t.fields.map((f,i)=>{const id=`${base}.${i}`,v=S.ans[id]||"",ok=!!v&&f.check(v),st=done?(ok?"ok":"bad"):"";
      return `<label class="field"><span>${f.label}</span><input type="text" id="${cid(id)}" data-id="${id}" class="${st}" value="${esc(v)}" autocomplete="off" spellcheck="false" ${done?"disabled":""}>${done&&!ok?`<em class="fix">${esc(f.show)}</em>`:""}</label>`}).join("")}</div>`;
  }else if(t.kind==="write"){
    const id=base+".text",v=S.ans[id]||"",w=words(v);
    h+=`<div class="prompt">${t.prompt}</div><div class="write">
      <div class="keys" role="group" aria-label="Lietuviškos raidės">${[..."ąčęėįšųūž"].map(c=>`<button type="button" class="key" data-ch="${c}" data-target="${cid(id)}">${c}</button>`).join("")}</div>
      <textarea id="${cid(id)}" data-id="${id}" rows="8" spellcheck="false" placeholder="Rašykite čia…" aria-label="Jūsų laiškas">${esc(v)}</textarea>
      <p class="wc ${w>=t.min&&w<=t.max?"in":""}" data-wc="${cid(id)}" data-min="${t.min}" data-max="${t.max}">${w} žodž. · reikia ${t.min}–${t.max}</p></div>
      <details class="model"><summary>Pavyzdinis atsakymas</summary>${done?`<div class="model-text">${esc(t.model)}</div>`:`<p class="muted">Pavyzdys bus parodytas, kai baigsite egzaminą.</p>`}</details>`+criteria(base,t);
  }else if(t.kind==="speak"){
    h+=`<ol class="prompts">${t.prompts.map((p,i)=>`<li><p><b>${i+1}.</b>${esc(p)}</p><button type="button" class="stimer" data-secs="60">Kalbėti 1:00</button></li>`).join("")}</ol>
      <div class="prompt phrases"><p class="crit-h">Naudingos frazės<span>Useful phrases</span></p><ul>${t.phrases.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`+criteria(base,t);
  }
  return h+`</section>`;
}
function renderSection(L,s){
  const ex=EXAM[L],sec=ex.sections[s],done=S.done[L];
  let tn=ex.sections.slice(0,s).reduce((a,x)=>a+x.tasks.length,0);
  const pts=sec.tasks.reduce((a,t)=>a+taskMax(t),0);
  let h=`<header class="sec-head"><p class="eyebrow">${L} · ${ex.name} · ${ROMAN[s]} dalis</p><h1>${sec.name}<span class="en">${sec.en}</span></h1><p class="meta">${tasku(pts)} · rekomenduojamas laikas ${sec.min} min.</p><p class="intro">${sec.intro}</p></header>`;
  if(sec.id==="klausymas")h+=`<div class="listen-bar"><div class="seg" role="group" aria-label="Skaitymo greitis"><button type="button" data-speed="0" aria-pressed="${!S.slow}">Įprastas greitis</button><button type="button" data-speed="1" aria-pressed="${S.slow}">Lėtai</button></div><p class="voice-note" id="voiceNote"></p></div>`;
  sec.tasks.forEach((t,ti)=>{tn++;h+=renderTask(L,s,ti,t,tn,done)});
  const n=ex.sections.length;
  h+=`<div class="next"><button type="button" class="btn primary" data-sec="${s+1}">${s+1<n?`Toliau: ${ROMAN[s+1]} dalis · ${ex.sections[s+1].name} →`:"Rezultatai →"}</button></div>`;
  return h;
}
function renderResults(L){
  const ex=EXAM[L],g=gradeLevel(L),done=S.done[L];
  let h=`<header class="sec-head"><p class="eyebrow">${L} · ${ex.name}</p><h1>Rezultatai<span class="en">Results</span></h1></header>`;
  if(!done){
    h+=`<p class="intro" style="margin-top:1.25rem">Kai baigsite, atsakymai bus įvertinti. Teisingi atsakymai bus pažymėti kiekvienoje dalyje, atsiras klausymo tekstai ir pavyzdiniai rašymo atsakymai. <i class="en">Finishing marks your answers and unlocks transcripts and model answers.</i></p>
    <ul class="todo">${g.map(r=>`<li><span>${r.name}</span><span>${r.self?"įsivertinimas":`atsakyta ${r.answered} iš ${r.auto}`}</span></li>`).join("")}</ul>
    <div class="actions"><button type="button" class="btn primary" id="finish">Baigti egzaminą</button></div>`;
    return h;
  }
  const pc=g.map(r=>r.mx?r.sc/r.mx:0),overall=pc.reduce((a,b)=>a+b,0)/pc.length,pass=overall>=0.6&&pc.every(p=>p>=0.4);
  const totS=g.reduce((a,r)=>a+r.sc,0),totM=g.reduce((a,r)=>a+r.mx,0);
  h+=`<div class="res-top"><div class="score">${Math.round(overall*100)}<small>%</small></div><div class="verdict"><span class="pill ${pass?"pass":"fail"}">${pass?`${L} lygis pasiektas`:`${L} lygis dar nepasiektas`}</span><p>${totS} iš ${tasku(totM)}. Kiekviena dalis sudaro penktadalį galutinio įvertinimo.</p></div></div>
  <div class="rows">${g.map((r,i)=>{const p=pc[i];return `<div class="rrow"><b>${ROMAN[i]}. ${r.name}<small>${r.en}${r.self?" · įsivertinta":""}</small></b><div class="bar"><i class="${p<0.4?"low":""}" style="width:${Math.round(p*100)}%"></i></div><span class="num">${r.sc}/${r.mx} · ${Math.round(p*100)}%</span></div>`}).join("")}</div>
  <p class="note">Praktinė riba: bent 60 % iš viso ir ne mažiau kaip 40 % kiekvienoje dalyje. Tikrame egzamine rašymą ir kalbėjimą vertina egzaminuotojai, o ribas nustato egzamino rengėjai. <i class="en">Practice threshold: 60% overall and at least 40% per part. In a real exam, examiners grade writing and speaking.</i></p>
  <p class="note">Atsakymus galite peržiūrėti kiekvienoje dalyje: teisingi pažymėti žaliai, klaidingi – raudonai.</p>
  <div class="actions">${ex.sections.map((sx,i)=>`<button type="button" class="btn" data-sec="${i}">${ROMAN[i]}. ${sx.name}</button>`).join("")}<button type="button" class="btn warn" id="reset">Pradėti ${L} iš naujo</button></div>`;
  return h;
}
function render(scroll){
  const L=S.level,ex=EXAM[L],si=S.sec[L],n=ex.sections.length;
  document.querySelectorAll("[data-level]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.level===L));
  $("#parts").innerHTML=ex.sections.map((s,i)=>`<button type="button" class="part" data-sec="${i}" aria-current="${i===si?"step":"false"}"><span class="rn">${ROMAN[i]}</span>${s.name}</button>`).join("")
    +`<button type="button" class="part" data-sec="${n}" aria-current="${si===n?"step":"false"}">${S.done[L]?'<span class="dot"></span>':""}Rezultatai</button>`;
  $("#paper").innerHTML=si<n?renderSection(L,si):renderResults(L);
  updateClock();updatePlayers();
  if(scroll)window.scrollTo({top:0});
}

/* ---------- timer ---------- */
function updateClock(){
  const t=S.timer[S.level],o=$("#clock"),b=$("#clockBtn");
  o.textContent=fmt(t.left);o.classList.toggle("over",t.left<=0);
  b.textContent=S.done[S.level]?"Baigta":t.left<=0?"Laikas baigėsi":t.running?"Pauzė":(t.left<EXAM[S.level].minutes*60?"Tęsti":"Pradėti laiką");
  b.disabled=S.done[S.level]||t.left<=0;
}
let tickN=0;
setInterval(()=>{
  let any=false;
  for(const L of ["A1","A2"]){const t=S.timer[L];if(t.running&&!S.done[L]){t.left--;any=true;if(t.left<=0){t.left=0;t.running=false}}}
  if(any){updateClock();if(++tickN%5===0)save()}
},1000);

/* ---------- speaking timer ---------- */
let sTimer=null;
function startSpeak(btn){
  if(sTimer){clearInterval(sTimer.iv);sTimer.btn.classList.remove("run");sTimer.btn.textContent="Kalbėti 1:00";if(sTimer.btn===btn){sTimer=null;return}}
  let left=+btn.dataset.secs;btn.classList.add("run");btn.textContent="■ "+fmt(left);
  const iv=setInterval(()=>{left--;if(!btn.isConnected){clearInterval(iv);sTimer=null;return}btn.textContent=left>0?"■ "+fmt(left):"Laikas!";if(left<=0){clearInterval(iv);btn.classList.remove("run");sTimer=null}},1000);
  sTimer={btn,iv};
}

/* ---------- events ---------- */
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.chk){S.chk[el.dataset.chk]=el.checked;save();return}
  if(el.type==="radio"&&el.dataset.id){S.ans[el.dataset.id]=Number(el.value);save();return}
  if(el.tagName==="SELECT"&&el.dataset.id){S.ans[el.dataset.id]=el.value;save()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if((el.tagName==="TEXTAREA"||el.type==="text")&&el.dataset.id){
    S.ans[el.dataset.id]=el.value;save();
    const wc=document.querySelector(`[data-wc="${el.id}"]`);
    if(wc){const w=words(el.value),mn=+wc.dataset.min,mx=+wc.dataset.max;wc.textContent=`${w} žodž. · reikia ${mn}–${mx}`;wc.classList.toggle("in",w>=mn&&w<=mx)}
  }
});
let confirmFinish=false,confirmReset=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.level){if(S.level!==b.dataset.level){if(playing){speechSynthesis.cancel();playing=null}S.level=b.dataset.level;save();render(true)}return}
  if(b.dataset.sec!==undefined){if(playing){speechSynthesis.cancel();playing=null}S.sec[S.level]=+b.dataset.sec;save();render(true);return}
  if(b.dataset.speed!==undefined){S.slow=b.dataset.speed==="1";save();document.querySelectorAll("[data-speed]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.speed===b.dataset.speed));return}
  if(b.classList.contains("play")){playClip(b.closest(".player").dataset.clip);return}
  if(b.classList.contains("tx")){const tr=b.closest(".player").nextElementSibling;tr.hidden=!tr.hidden;b.textContent=tr.hidden?"Rodyti tekstą":"Slėpti tekstą";return}
  if(b.classList.contains("key")){const ta=document.getElementById(b.dataset.target);if(!ta)return;const st=ta.selectionStart??ta.value.length,en=ta.selectionEnd??st;ta.setRangeText(b.dataset.ch,st,en,"end");ta.focus();ta.dispatchEvent(new Event("input",{bubbles:true}));return}
  if(b.classList.contains("stimer")){startSpeak(b);return}
  if(b.id==="clockBtn"){const t=S.timer[S.level];if(t.left>0&&!S.done[S.level]){t.running=!t.running;save();updateClock()}return}
  if(b.id==="finish"){
    if(!confirmFinish){confirmFinish=true;b.classList.add("confirm");b.textContent="Spauskite dar kartą, kad baigtumėte";setTimeout(()=>{confirmFinish=false;if(b.isConnected){b.classList.remove("confirm");b.textContent="Baigti egzaminą"}},4000);return}
    confirmFinish=false;S.done[S.level]=true;S.timer[S.level].running=false;save();render(true);return}
  if(b.id==="reset"){
    if(!confirmReset){confirmReset=true;b.textContent="Spauskite dar kartą: visi atsakymai bus ištrinti";setTimeout(()=>{confirmReset=false;if(b.isConnected)b.textContent=`Pradėti ${S.level} iš naujo`},4000);return}
    confirmReset=false;const L=S.level,p=L+".";
    for(const o of [S.ans,S.chk,S.plays])for(const k of Object.keys(o))if(k.startsWith(p))delete o[k];
    S.done[L]=false;S.sec[L]=0;S.timer[L]={left:EXAM[L].minutes*60,running:false};save();render(true);return}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches&&e.target.matches('.field input')&&e.key==="Enter")e.preventDefault();
});
render(false);
</script>

</body>
