<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d6a4f">
  <title>jrodimusprime — Games</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8968684526399437"
       crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --accent: #e9c46a;
      --text: #edf2f4;
      --muted: #8d99ae;
      --primary: #2d6a4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, var(--bg), #1b4332);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    a.btn {
      display: block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    a.secondary {
      color: var(--accent);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🕊️ Zoo Peace Maker</h1>
    <p>Calm every animal. Restore the peace. A mobile-friendly browser game.</p>
    <a class="btn" href="/ZooPeace/">Play Zoo Peace Maker</a>
    <p><a class="secondary" href="/privacy.html">Privacy Policy</a></p>
  </main>
</body>
</html>
