<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e1110">
  <title>jrodimusprime</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8968684526399437"
       crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 38%, #26302b 0%, #121614 55%, #070908 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script>
  (function () {
    if (!window.THREE) return;
    const T = THREE;

    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
    const target = new T.Vector3(0, 1.4, 0);

    function frame() {
      const aspect = window.innerWidth / window.innerHeight;
      camera.aspect = aspect;
      // Pull back on tall/narrow screens so the whole jar fits
      const dist = aspect < 0.8 ? 7.4 / Math.max(aspect, 0.45) * 0.62 : 7.4;
      camera.position.set(0, 2.3, dist);
      camera.lookAt(target);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    frame();
    window.addEventListener('resize', frame);

    // ---------- Cheap studio environment for glass/metal reflections ----------
    const pmrem = new T.PMREMGenerator(renderer);
    const envScene = new T.Scene();
    envScene.add(new T.Mesh(new T.BoxGeometry(20, 20, 20), new T.MeshBasicMaterial({ color: 0x1a201d, side: T.BackSide })));
    const panel = (w, h, x, y, z, ry, c) => {
      const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide }));
      m.position.set(x, y, z); m.rotation.y = ry; m.lookAt(0, 0, 0); envScene.add(m);
    };
    panel(6, 10, -7, 3, 3, 0, 0xffffff);
    panel(3, 10, 7, 2, -2, 0, 0xcfe0ff);
    panel(10, 3, 0, 9, 0, 0, 0xfff3e0);
    scene.environment = pmrem.fromScene(envScene, 0.03).texture;

    // ---------- Lights ----------
    scene.add(new T.HemisphereLight(0xdfe8e2, 0x1b1712, 0.55));
    const key = new T.SpotLight(0xfff1dc, 2.2, 30, Math.PI / 6, 0.6, 1);
    key.position.set(3.5, 7, 4.5); key.target.position.copy(target);
    scene.add(key, key.target);
    const rim = new T.DirectionalLight(0x9fc4ff, 0.9);
    rim.position.set(-4, 3, -5);
    scene.add(rim);
    const under = new T.PointLight(0xd8e88a, 0.6, 6);
    under.position.set(0, 0.4, 0);
    scene.add(under);

    // ---------- Jar ----------
    const jar = new T.Group();
    scene.add(jar);

    const R = 1.0, H = 2.55;
    const jarProfile = [
      [0.0, 0.0], [0.86, 0.0], [0.97, 0.03], [1.0, 0.12],
      [1.0, H - 0.25], [0.96, H - 0.12], [0.88, H - 0.04], [0.86, H], [0.86, H + 0.18]
    ].map(p => new T.Vector2(p[0], p[1]));

    const glassMat = new T.MeshPhysicalMaterial({
      color: 0xeaf6f0, metalness: 0, roughness: 0.04,
      transparent: true, opacity: 0.16, clearcoat: 1, clearcoatRoughness: 0.03,
      envMapIntensity: 1.6, side: T.DoubleSide, depthWrite: false
    });
    const glass = new T.Mesh(new T.LatheGeometry(jarProfile, 96), glassMat);
    glass.renderOrder = 3;
    jar.add(glass);

    // thick glass base
    const base = new T.Mesh(new T.CylinderGeometry(0.9, 0.95, 0.1, 64),
      new T.MeshPhysicalMaterial({ color: 0xcfe8dc, roughness: 0.1, transparent: true, opacity: 0.35, clearcoat: 1, depthWrite: false }));
    base.position.y = 0.05; base.renderOrder = 2;
    jar.add(base);

    // Liquid (preserving fluid)
    const liquidTop = H - 0.45;
    const liquidMat = new T.MeshPhysicalMaterial({
      color: 0xcbd97c, roughness: 0.15, metalness: 0,
      transparent: true, opacity: 0.3, envMapIntensity: 0.8, depthWrite: false
    });
    const liquid = new T.Mesh(new T.CylinderGeometry(R - 0.03, R - 0.03, liquidTop - 0.1, 96, 1, false), liquidMat);
    liquid.position.y = 0.1 + (liquidTop - 0.1) / 2;
    liquid.renderOrder = 1;
    jar.add(liquid);
    const meniscus = new T.Mesh(new T.TorusGeometry(R - 0.035, 0.018, 8, 96),
      new T.MeshPhysicalMaterial({ color: 0xe6f0b0, roughness: 0.1, transparent: true, opacity: 0.5, depthWrite: false }));
    meniscus.rotation.x = Math.PI / 2; meniscus.position.y = liquidTop; meniscus.renderOrder = 2;
    jar.add(meniscus);

    // Lid
    const lidMat = new T.MeshStandardMaterial({ color: 0x8c8f8d, metalness: 0.9, roughness: 0.38, envMapIntensity: 1.2 });
    const lid = new T.Mesh(new T.CylinderGeometry(0.93, 0.93, 0.26, 72), lidMat);
    lid.position.y = H + 0.16;
    jar.add(lid);
    const lidTop = new T.Mesh(new T.CylinderGeometry(0.88, 0.93, 0.05, 72), lidMat);
    lidTop.position.y = H + 0.315;
    jar.add(lidTop);
    for (let i = 0; i < 5; i++) {
      const ridge = new T.Mesh(new T.TorusGeometry(0.935, 0.012, 6, 72), lidMat);
      ridge.rotation.x = Math.PI / 2; ridge.position.y = H + 0.07 + i * 0.045;
      jar.add(ridge);
    }

    // Paper label
    const lc = document.createElement('canvas');
    lc.width = 1024; lc.height = 512;
    const g = lc.getContext('2d');
    g.fillStyle = '#e9dfc4'; g.fillRect(0, 0, 1024, 512);
    // age stains
    for (let i = 0; i < 14; i++) {
      const x = Math.random() * 1024, y = Math.random() * 512, r = 40 + Math.random() * 140;
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(150,120,60,0.10)'); rg.addColorStop(1, 'rgba(150,120,60,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 1024, 512);
    }
    g.strokeStyle = '#3a2f22'; g.lineWidth = 6; g.strokeRect(30, 30, 964, 452);
    g.lineWidth = 2; g.strokeRect(46, 46, 932, 420);
    g.fillStyle = '#2b231a'; g.textAlign = 'center';
    g.font = 'bold 92px Georgia, "Times New Roman", serif';
    g.fillText('SPECIMEN', 512, 170);
    g.font = 'italic 64px Georgia, "Times New Roman", serif';
    g.fillText('Digitus secundus', 512, 270);
    g.beginPath(); g.moveTo(180, 312); g.lineTo(844, 312); g.stroke();
    g.font = '52px "Courier New", monospace';
    g.fillText('No. 0417  ·  1923', 512, 400);
    const labelTex = new T.CanvasTexture(lc);
    labelTex.encoding = T.sRGBEncoding;
    labelTex.anisotropy = 4;
    const labelArc = 1.5;
    const label = new T.Mesh(
      new T.CylinderGeometry(R + 0.006, R + 0.006, 0.78, 48, 1, true, -labelArc / 2, labelArc),
      new T.MeshStandardMaterial({ map: labelTex, roughness: 0.9, side: T.FrontSide })
    );
    label.position.y = 0.95;
    jar.add(label);
    const labelBack = new T.Mesh(
      new T.CylinderGeometry(R + 0.004, R + 0.004, 0.78, 48, 1, true, -labelArc / 2, labelArc),
      new T.MeshStandardMaterial({ color: 0xcfc2a0, roughness: 1, side: T.BackSide })
    );
    labelBack.position.y = 0.95;
    jar.add(labelBack);

    // ---------- Finger ----------
    const finger = new T.Group();
    const skin = new T.MeshPhysicalMaterial({
      color: 0xe2b8a0, roughness: 0.55, metalness: 0, sheen: 0.4, sheenColor: new T.Color(0xffd9c8),
      clearcoat: 0.25, clearcoatRoughness: 0.5
    });

    // Lathe profile: y along finger, x = radius. Base (cut end) at y=0, tip at top.
    const L = 1.75;
    const prof = [
      [0.0, 0.0], [0.17, 0.0], [0.192, 0.03], [0.198, 0.12], [0.196, 0.3],
      [0.206, 0.52], [0.21, 0.6], [0.2, 0.7], [0.182, 0.86], [0.18, 0.98],
      [0.188, 1.12], [0.19, 1.18], [0.178, 1.28], [0.165, 1.4], [0.162, 1.5]
    ];
    // rounded tip
    const tipStart = 1.5, tipR = 0.162;
    for (let i = 1; i <= 10; i++) {
      const a = (i / 10) * Math.PI / 2;
      prof.push([Math.cos(a) * tipR, tipStart + Math.sin(a) * (L - tipStart)]);
    }
    const fingerGeo = new T.LatheGeometry(prof.map(p => new T.Vector2(p[0], p[1])), 64);
    // Flatten slightly front-to-back so it reads as a finger, not a tube
    fingerGeo.scale(1, 1, 0.86);
    const fingerMesh = new T.Mesh(fingerGeo, skin);
    finger.add(fingerMesh);

    // Pale cut end
    const stump = new T.Mesh(new T.CircleGeometry(0.168, 40),
      new T.MeshStandardMaterial({ color: 0xc99486, roughness: 0.8 }));
    stump.rotation.x = Math.PI / 2; stump.scale.set(1, 0.86, 1); stump.position.y = 0.002;
    finger.add(stump);

    // Fingernail
    const nail = new T.Mesh(new T.SphereGeometry(1, 32, 16),
      new T.MeshPhysicalMaterial({ color: 0xf0d2c6, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.1 }));
    nail.scale.set(0.115, 0.17, 0.045);
    nail.position.set(0, 1.45, 0.118);
    nail.rotation.x = -0.12;
    finger.add(nail);

    // Knuckle creases on the back (+z) of the finger
    const creaseMat = new T.MeshStandardMaterial({ color: 0xbf9280, roughness: 0.8 });
    [[0.56, 0.207], [0.6, 0.21], [0.64, 0.207], [1.15, 0.189], [1.19, 0.19]].forEach(([y, r]) => {
      const c = new T.Mesh(new T.TorusGeometry(r, 0.006, 5, 24, Math.PI * 0.7), creaseMat);
      // arc spans 0.15π..0.85π in local XY, then tipped flat so it wraps the +z side
      c.rotation.set(Math.PI / 2, 0, Math.PI * 0.15);
      c.scale.set(1, 0.86, 1);
      c.position.y = y;
      finger.add(c);
    });

    finger.position.set(0.05, 0.35, 0);
    finger.rotation.set(0.12, 0.4, -0.22);
    jar.add(finger);

    // ---------- Bubbles ----------
    const bubbleMat = new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0, transparent: true, opacity: 0.45, clearcoat: 1, depthWrite: false });
    const bubbleGeo = new T.SphereGeometry(1, 12, 8);
    const bubbles = [];
    for (let i = 0; i < 18; i++) {
      const b = new T.Mesh(bubbleGeo, bubbleMat);
      const s = 0.012 + Math.random() * 0.025;
      b.scale.setScalar(s);
      b.userData = { a: Math.random() * Math.PI * 2, r: 0.2 + Math.random() * 0.65, v: 0.12 + Math.random() * 0.25, w: Math.random() * 3 };
      b.position.y = 0.15 + Math.random() * (liquidTop - 0.2);
      b.renderOrder = 1;
      bubbles.push(b); jar.add(b);
    }

    // ---------- Soft floor shadow ----------
    const sc = document.createElement('canvas'); sc.width = sc.height = 256;
    const sg = sc.getContext('2d');
    const grad = sg.createRadialGradient(128, 128, 10, 128, 128, 128);
    grad.addColorStop(0, 'rgba(0,0,0,0.65)'); grad.addColorStop(0.6, 'rgba(0,0,0,0.25)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    sg.fillStyle = grad; sg.fillRect(0, 0, 256, 256);
    const shadow = new T.Mesh(new T.PlaneGeometry(3.4, 3.4),
      new T.MeshBasicMaterial({ map: new T.CanvasTexture(sc), transparent: true, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = -0.005;
    scene.add(shadow);

    // ---------- Animate ----------
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const spin = reduce ? 0.12 : 0.45;
    const clock = new T.Clock();
    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      jar.rotation.y += dt * spin;
      jar.position.y = Math.sin(t * 0.6) * 0.03;
      finger.position.y = 0.35 + Math.sin(t * 0.9) * 0.05;
      finger.rotation.z = -0.22 + Math.sin(t * 0.7) * 0.04;
      finger.rotation.x = 0.12 + Math.cos(t * 0.55) * 0.03;
      for (const b of bubbles) {
        const u = b.userData;
        b.position.y += u.v * dt;
        b.position.x = Math.cos(u.a) * u.r + Math.sin(t * 2 + u.w) * 0.02;
        b.position.z = Math.sin(u.a) * u.r;
        if (b.position.y > liquidTop - 0.02) { b.position.y = 0.15; u.a = Math.random() * Math.PI * 2; }
      }
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
  })();
  </script>
</body>
</html>
